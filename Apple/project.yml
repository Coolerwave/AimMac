# Generates AimMac.xcodeproj with XcodeGen:
#   brew install xcodegen
#   cd Apple && xcodegen
# Then open AimMac.xcodeproj and run. Signing settings live in Config.xcconfig.

name: AimMac
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AimMac:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: ../Shared
      - path: Assets.xcassets
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: AimMac
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSBluetoothAlwaysUsageDescription: AimMac connects to your Mac over Bluetooth to move the pointer.
        NSMotionUsageDescription: AimMac uses motion to aim the pointer.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).aimmac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  AimMacWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
      - path: ../Shared
      - path: Assets.xcassets
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: AimMac
        WKApplication: true
        WKWatchOnly: true
        NSBluetoothAlwaysUsageDescription: AimMac connects to your Mac over Bluetooth to move the pointer.
        NSMotionUsageDescription: AimMac uses motion to aim the pointer.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).aimmac.watch
        PRODUCT_NAME: AimMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
